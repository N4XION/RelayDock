# Builds the release files for a version tag and publishes the release.
#
# A maintainer works through docs/release-checklist.md, writes docs/release-notes/<version>.md
# and pushes a tag such as v1.0.0. This workflow builds, tests and packages that commit, checks
# that the build is reproducible, and publishes the release with those notes and the files.
# A tag with a suffix, such as v1.0.0-rc.1, becomes a pre-release.
#
# Nothing reaches a release that these steps did not build from the tagged source.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # To create the release

jobs:
  release:
    name: Build and publish
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The tag matches the version, and its release notes exist
        shell: pwsh
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $version = if ($spec.versionSuffix) { "$($spec.version)-$($spec.versionSuffix)" } else { $spec.version }
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "The tag ${{ github.ref_name }} does not match buildspec.json, which says $version."
          }
          if (-not (Test-Path "docs/release-notes/$version.md")) {
            throw "docs/release-notes/$version.md is missing. Write the release notes before you tag."
          }

      - name: No secrets in the repository
        shell: pwsh
        run: ./scripts/scan-secrets.ps1
      - name: Locale file matches the source
        shell: pwsh
        run: ./scripts/update-locale.ps1 -Check
      - name: Licence notice matches the vendored licences
        shell: pwsh
        run: ./scripts/update-third-party-licenses.ps1 -Check
      - name: The versions page matches the changelog
        shell: pwsh
        run: ./scripts/update-versions.ps1 -Check
      - name: Documentation links and wording
        shell: pwsh
        run: ./scripts/check-docs.ps1

      - name: Configure
        run: cmake --preset windows-ci-x64
      - name: Build
        run: cmake --build --preset windows-ci-x64
      - name: Test
        run: ctest --preset windows-ci-x64

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Preset windows-ci-x64 -SkipBuild -RequireInstaller

      # Two more builds from scratch. They must match each other byte for byte, and match the
      # packaged DLL in all code and data.
      - name: The build is reproducible
        shell: pwsh
        run: |
          Expand-Archive (Get-Item release/RelayDock-*-windows-x64.zip) -DestinationPath "$env:RUNNER_TEMP/released"
          ./scripts/check-reproducible.ps1 -Preset windows-ci-x64 -ScratchDir "$env:RUNNER_TEMP/repro" -CompareWith "$env:RUNNER_TEMP/released/relaydock/bin/64bit/relaydock.dll"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relaydock-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1 -Tag "${{ github.ref_name }}" -Repository "${{ github.repository }}" -BuildDir build_x64
