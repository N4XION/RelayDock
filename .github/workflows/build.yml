# Builds RelayDock, runs its automated tests and produces the release files on every push and
# pull request. Runs on GitHub's free runners for public repositories.
#
# Actions are pinned to a commit, so a changed tag cannot swap the code this workflow runs.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No secrets in the repository
        shell: pwsh
        run: ./scripts/scan-secrets.ps1
      - name: Locale file matches the source
        shell: pwsh
        run: ./scripts/update-locale.ps1 -Check
      - name: Licence notice matches the vendored licences
        shell: pwsh
        run: ./scripts/update-third-party-licenses.ps1 -Check
      - name: The versions page matches the changelog
        shell: pwsh
        run: ./scripts/update-versions.ps1 -Check
      - name: Documentation links and wording
        shell: pwsh
        run: ./scripts/check-docs.ps1

  core:
    name: Unit and security tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The build number is the number of commits
      - name: Configure
        run: cmake --preset core-tests
      - name: Build
        run: cmake --build --preset core-tests
      - name: Test
        run: ctest --preset core-tests

  plugin:
    name: Plugin and release files
    runs-on: windows-2022
    needs: [checks, core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore OBS sources and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('buildspec.json', 'cmake/**') }}
      - name: Configure
        run: cmake --preset windows-ci-x64
      - name: Build
        run: cmake --build --preset windows-ci-x64
      - name: Test
        run: ctest --preset windows-ci-x64
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Preset windows-ci-x64 -SkipBuild -RequireInstaller
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relaydock-${{ github.sha }}
          path: release/
          if-no-files-found: error
