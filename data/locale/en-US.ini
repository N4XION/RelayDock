Optimization.Intro="RelayDock watches dropped frames, encoder lag and rendering lag while you stream. When one stays high, it can lower bitrate, frame rate or resolution, and bring them back when the problem is gone. These are fixed rules, not artificial intelligence."
Optimization.Off="Off"
Optimization.Off.Note="RelayDock changes nothing and proposes nothing."
Optimization.Rules="How it decides"
Optimization.Rules.Text="A measurement has to stay above its limit for 20 seconds before anything happens. After a change, RelayDock waits 60 seconds. Quality returns one step at a time after five minutes without a problem. If a step up brings the problem back, the next attempt waits twice as long. A setting you locked is never changed, and a destination can opt out in its Advanced settings."
Optimization.Suggest="Suggest changes"
Optimization.Suggest.Note="A suggestion appears in the dock. You choose Apply, Ignore or Lock Setting. Nothing changes until you do."
