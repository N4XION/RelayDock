Notes.Facebook.Key="Find the stream key at facebook.com/live/create: Go live, Streaming software. A standard key works for one stream only. Turn on Persistent stream key under Advanced settings to reuse one."
Notes.Facebook.Limits="Facebook ends a stream after 8 hours. After a lost connection you have 2 to 3 minutes to reconnect before you need a new key."
Notes.Facebook.Preview="Facebook shows a preview when RelayDock connects. Viewers see the stream after you click Go live on Facebook."
Notes.TikTok.Access="TikTok gives a server URL and stream key only to accounts with LIVE access for streaming software. TikTok decides who gets it, and the rules differ by region."
Notes.TikTok.End="Stopping the stream in RelayDock does not end the LIVE on TikTok. End it on TikTok as well."
Notes.TikTok.Key="Set up the LIVE on TikTok first, then copy the server URL and the stream key from that page. The key expires after a period without use, so copy it less than an hour before you stream."
Notes.Twitch.Key="Find your stream key in the Twitch Creator Dashboard under Settings, Stream. The key stays the same until you reset it."
Notes.Twitch.Simulcast="Twitch allows streaming to other platforms at the same time when your Twitch stream is at least as good as the others, you do not send viewers away from Twitch, and you do not merge other platforms' chat into the Twitch stream."
Notes.Twitch.Test="Test stream connects with your real key but your channel does not go live and Twitch sends no notifications."
Notes.YouTube.GoesLive="With the default settings YouTube goes live and notifies your subscribers as soon as RelayDock connects. To try a stream first, set its visibility to Private or Unlisted in YouTube Studio."
Notes.YouTube.Key="Find your stream key in YouTube Studio: Create, Go live, Stream tab. The default key stays the same between streams."
Notes.YouTube.Vertical="For a vertical stream next to a horizontal one, YouTube needs a second stream key. Add a second YouTube destination for it."
